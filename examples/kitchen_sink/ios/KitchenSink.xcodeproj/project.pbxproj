			shellScript = "set -e\n# Xcode strips the user PATH; zig is usually a Homebrew install.\nexport PATH=\"$PATH:/opt/homebrew/bin:/usr/local/bin\"\n# zig build runs from the repository root; outputs land next to this\n# project so the example stays self-contained.\ncd \"$SRCROOT/../../..\"\ncase \"$PLATFORM_NAME\" in\n  iphonesimulator) ZIG_TARGET=aarch64-ios-simulator ;;\n  *) ZIG_TARGET=aarch64-ios ;;\nesac\nzig build -Dskia -Dtarget=\"$ZIG_TARGET\" -Doptimize=ReleaseSafe -p \"$SRCROOT/build/zig-$PLATFORM_NAME\"\n# Apple's linker rejects zig's archive member alignment; extract and\n# repack with libtool (which drops misaligned members if fed the\n# archive directly, so it must see loose objects).\nfor lib in \"$SRCROOT/build/zig-$PLATFORM_NAME/lib\"/*.a; do\n  tmp=$(mktemp -d)\n  (cd \"$tmp\" && ar x \"$lib\" && chmod u+rw ./*)\n  xcrun libtool -static -no_warning_for_no_symbols -o \"$lib.tmp\" \"$tmp\"/*.o\n  mv \"$lib.tmp\" \"$lib\"\n  rm -rf \"$tmp\"\ndone\n# The generated asset catalog (the derived app icon) needs a\n# $(PLATFORM_NAME)-independent home: Xcode file references cannot\n# expand build settings, so mirror it to the stable path the project\n# points at. Resources compile after this phase, so it exists in time.\nrm -rf \"$SRCROOT/build/pkg/Assets.xcassets\"\nmkdir -p \"$SRCROOT/build/pkg\"\ncp -R \"$SRCROOT/build/zig-$PLATFORM_NAME/pkg/ios/Assets.xcassets\" \"$SRCROOT/build/pkg/Assets.xcassets\"\n";
