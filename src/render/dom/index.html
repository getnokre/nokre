<!doctype html>
<!--
  The host page for a live DOM-edition app.

  It is this short on purpose: everything a nokre app puts on screen
  comes out of the tree, so a page around one has nothing to say except
  where the module and the stylesheet are. There is no markup here to
  keep in step with the app, because there is none to get wrong.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nokre — kitchen sink</title>
<link rel="stylesheet" href="./style.css">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<style>
  /* The one thing the tree cannot say: how wide a window is allowed to
     get before its prose stops being readable. That is the host page's
     call, and this is a host page making it.

     Its own number, not `--pane`: that variable is `sheet_max_w`, which
     the library spends on the surfaces holding prose *inside* an app —
     a sheet, the notices pane, a select's picker. Borrowing it would
     make this cap look like a library rule rather than a page agreeing
     with one, and retuning it would move all of those panes. 560 is the
     phone's answer; a desktop window reading 560px of 1400 looks like a
     phone emulator, so it steps once and no further.

     On the mount container, not on the screen inside it: the driver
     reports that container's width to core as the viewport, so a cap
     the page keeps to itself would be a column core never heard of —
     and every measured decision core makes (where prose wraps, whether
     a row of actions folds, whether a track has to bleed) would be
     answered against a width nobody is looking at. Which is also why
     the step below is not a page style: it hands core a wider viewport
     and has it answer those questions again. */
  :root { --page-col: 560px; }
  @media (min-width: 900px) { :root { --page-col: 760px; } }
  body { margin: 0; background: var(--paper); }
  #app { max-width: calc(var(--page-col) + 2 * var(--page-pad)); margin-inline: auto; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
  import { mount } from "./live.js";
  await mount({ wasm: "./app.wasm", into: document.getElementById("app") });
</script>
</body>
</html>
